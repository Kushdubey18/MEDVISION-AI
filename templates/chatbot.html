<!DOCTYPE html>
<html>

<head>

<title>MedVision AI Assistant</title>

<style>

body{
    font-family:Arial;
    background:#f4f8fb;
}

.container{

    width:60%;
    margin:50px auto;
    background:white;
    padding:30px;
    border-radius:15px;
    box-shadow:0px 5px 20px #ccc;

}


h1{

color:#0d6efd;
text-align:center;

}


textarea{

width:100%;
height:120px;
padding:10px;

}


button{

background:#0d6efd;
color:white;
padding:12px 25px;
border:none;
border-radius:8px;
cursor:pointer;

}


.response{

margin-top:25px;
background:#eef6ff;
padding:20px;
border-radius:10px;

}

</style>


</head>


<body>


<div class="container">


<h1>
🤖 MedVision AI Assistant
</h1>


<form method="POST">


<textarea 
name="message"
placeholder="Ask about X-ray, pneumonia, precautions..."
></textarea>


<br><br>


<button>
Ask Gemini
</button>


</form>



{% if response %}

<div class="response">

<h3>AI Response:</h3>

<p>
{{response}}
</p>

</div>

{% endif %}



</div>


</body>

</html>
