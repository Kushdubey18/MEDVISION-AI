<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Prediction History | MedVision AI</title>


<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI', sans-serif;
}


body{

    background:#f4f8fb;
    color:#333;

}


/* Navbar */

.navbar{

    background:#0d6efd;
    padding:18px 40px;
    color:white;
    display:flex;
    justify-content:space-between;
    align-items:center;

}


.navbar h2{

    font-size:26px;

}


.navbar a{

    color:white;
    text-decoration:none;
    margin-left:25px;
    font-weight:500;

}


/* Main Container */

.container{

    width:90%;
    margin:40px auto;

}


/* Heading */

.title{

    text-align:center;
    margin-bottom:30px;

}


.title h1{

    color:#0d6efd;
    font-size:36px;

}


.title p{

    color:#666;
    margin-top:10px;

}



/* Card */

.card{

    background:white;
    padding:30px;
    border-radius:15px;
    box-shadow:0px 5px 20px rgba(0,0,0,0.1);

}



/* Table */

table{

    width:100%;
    border-collapse:collapse;

}


th{

    background:#0d6efd;
    color:white;
    padding:15px;
    text-align:center;

}


td{

    padding:14px;
    text-align:center;
    border-bottom:1px solid #ddd;

}


tr:hover{

    background:#f1f7ff;

}



/* Prediction Badge */

.badge{

    padding:7px 15px;
    border-radius:20px;
    font-weight:bold;

}


.normal{

    background:#d4edda;
    color:#155724;

}


.pneumonia{

    background:#f8d7da;
    color:#721c24;

}


/* Footer */

.footer{

    text-align:center;
    margin-top:40px;
    color:#777;

}



@media(max-width:700px){

.container{

    width:95%;

}

table{

    font-size:12px;

}

}


</style>


</head>


<body>


<!-- Navbar -->

<div class="navbar">

<h2>🩺 MedVision AI</h2>


<div>

<a href="/">Home</a>
<a href="/history">History</a>
<a href="/contact">Contact</a>

</div>


</div>



<div class="container">


<div class="title">

<h1>Prediction History</h1>

<p>
Previous Chest X-Ray Analysis Records
</p>

</div>



<div class="card">


{% if tables %}

{{ tables | safe }}


{% else %}


<h3 style="text-align:center;color:#777;">
No Prediction History Available
</h3>


{% endif %}



</div>



<div class="footer">

<p>
© 2026 MedVision AI | AI Powered Medical Diagnosis System
</p>

</div>


</div>



</body>

</html>
